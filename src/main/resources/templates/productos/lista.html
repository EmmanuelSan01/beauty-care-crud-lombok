<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Reservas</h1>
        <a class="btn btn-bc" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
    </div>

    <!-- Mensajes que llegan despues de crear, editar o borrar -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}">Listo</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card card-bc">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Sala</th>
                    <th class="text-end">Horas</th>
                    <th class="text-center">Equipo</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td>
                        <div class="fw-semibold" th:text="${p.usuario}">Usuario</div>
                        <div class="small text-muted" th:text="${p.motivo}">Motivo</div>
                    </td>
                    <td><span class="badge badge-sala" th:text="${p.sala}">Sala</span></td>
                    <td class="text-end text-nowrap"
                        th:text="${#numbers.formatInteger(p.horas, 1, 'POINT')}">0</td>
                    <td class="text-center">
                        <span class="badge"
                              th:classappend="${p.equipo <= 5} ? 'text-bg-warning' : 'text-bg-success'"
                              th:text="${p.equipo}">0</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/productos/{id}/editar(id=${p.id})}">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/productos/{id}/eliminar(id=${p.id})}"
                              onsubmit="return confirm('¿Eliminar este producto?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Aún no hay productos. Crea el primero con "Nuevo producto".
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
